version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flashkart-postgres
    restart: always
    environment:
      POSTGRES_USER: flashuser
      POSTGRES_PASSWORD: flashpassword
      POSTGRES_DB: flashkart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flashkart-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
